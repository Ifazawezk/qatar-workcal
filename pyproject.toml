[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qatar-workcal"
version = "0.1.0"
description = "Working calendar for software teams in Qatar: holidays, Ramadan hours, SLA due times and sprint capacity"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohaned Elhagar" }]
requires-python = ">=3.10"
dependencies = ["hijridate>=2.3", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
workcal = "qatar_workcal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
